<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/images/icon.webp" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Muhamad Sidik | Creative Designer</title>
    <meta
      name="description"
      content="Explore the creative portfolio of Muhamad Sidik, a specialized Creative Designer focusing on UI/UX, Game Design, and Interactive Visuals."
    />

    <!-- Preload Critical LCP Hero Image -->
    <link rel="preload" as="image" href="/images/hero/hero_me.webp" type="image/webp" fetchpriority="high" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://muhamadsidik.id/" />
    <meta property="og:title" content="Muhamad Sidik | Creative Designer" />
    <meta
      property="og:description"
      content="Explore my creative portfolio featuring Creative Design, UI/UX, and Interactive Projects."
    />
    <meta property="og:image" content="/images/hero/og.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://muhamadsidik.id/" />
    <meta
      property="twitter:title"
      content="Muhamad Sidik | Creative Designer"
    />
    <meta
      property="twitter:description"
      content="Explore my creative portfolio featuring Creative Design, UI/UX, and Interactive Projects."
    />
    <meta property="twitter:image" content="/images/hero/og.png" />

    <!-- Fonts Preconnect & Async Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300&family=Press+Start+2P&family=Silkscreen&family=VT323&display=swap"
      rel="stylesheet"
    />

    <style>
      html {
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      document.onkeydown = function (e) {
        // Zoom prevention
        if (
          (e.ctrlKey || e.metaKey) &&
          (e.key === "+" || e.key === "-" || e.key === "=" || e.key === "0")
        ) {
          e.preventDefault();
        }
      };

      // Prevent pinch-zoom on trackpad/mouse
      document.addEventListener(
        "wheel",
        function (e) {
          if (e.ctrlKey) {
            e.preventDefault();
          }
        },
        { passive: false },
      );
    </script>
  </body>
</html>
